<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.52" stop-color="#ec4f8c"/>
      <stop offset="1" stop-color="#6d4dff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b0a33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- основа -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- связи: тимлид вызывает двух агентов -->
  <g fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" opacity="0.95">
    <path d="M436 512 C 506 512, 496 336, 560 336"/>
    <path d="M436 512 C 506 512, 496 688, 560 688"/>
  </g>

  <!-- карточки агентов -->
  <g filter="url(#lift)" fill="#fff">
    <rect x="186" y="432" width="254" height="160" rx="38"/>
    <rect x="566" y="256" width="262" height="160" rx="38"/>
    <rect x="566" y="608" width="262" height="160" rx="38"/>
  </g>

  <!-- значки ролей -->
  <rect x="218" y="472" width="80" height="80" rx="22" fill="#7c3aed"/>
  <rect x="598" y="296" width="80" height="80" rx="22" fill="#2563eb"/>
  <rect x="598" y="648" width="80" height="80" rx="22" fill="#e11d48"/>
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(234 488) scale(2)" d="M12 3.5l2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 16.4l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z"/>
    <path transform="translate(614 312) scale(2)" d="M14.7 6.3a4 4 0 0 0-5.3 5.3L3.5 17.5l3 3 5.9-5.9a4 4 0 0 0 5.3-5.3l-2.6 2.6-2.3-.6-.6-2.3z"/>
    <path transform="translate(614 664) scale(2)" d="M5 12.5l4.5 4.5L19 7.5"/>
  </g>

  <!-- «строчки текста» на карточках -->
  <g fill="#ddd5ea">
    <rect x="318" y="486" width="94" height="22" rx="11"/>
    <rect x="318" y="522" width="64" height="22" rx="11"/>
    <rect x="698" y="310" width="102" height="22" rx="11"/>
    <rect x="698" y="346" width="70" height="22" rx="11"/>
    <rect x="698" y="662" width="102" height="22" rx="11"/>
    <rect x="698" y="698" width="70" height="22" rx="11"/>
  </g>
</svg>
